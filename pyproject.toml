[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "albis"
version = "0.1.0"
description = "Albis - A muLti-resolution Biological In-silico Simulator for 3D spatial transcriptomics."
readme = "README_PYPI.md"
requires-python = ">=3.10"
authors = [
    { name = "Jan Matthias" },
    { name = "Jianing Yao" },
    { name = "Stephanie Hicks" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["spatial-transcriptomics", "simulation", "anndata", "multi-resolution"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.10",
    "numpy>=1.23",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
]
tutorial = [
    "ipykernel>=6",
    "nbformat>=5",
    "notebook>=7",
]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/JanMatthias1/Albis"
Documentation = "https://github.com/JanMatthias1/Albis#readme"
Repository = "https://github.com/JanMatthias1/Albis"
Issues = "https://github.com/JanMatthias1/Albis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["albis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
